name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Boot the real entry point the way a host would, then talk to it.
      - name: Smoke test the deployed entry point
        run: |
          set -euo pipefail
          NODE_ENV=production SEED_DEMO=1 DATABASE_PATH=:memory: PORT=4173 \
            node --disable-warning=ExperimentalWarning scripts/serve.ts &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/healthz && break
            sleep 1
          done
          curl -fsS -o /dev/null -w 'index.html %{http_code}\n' http://127.0.0.1:4173/
          curl -fsS -X POST http://127.0.0.1:4173/api/signup \
            -H 'content-type: application/json' \
            -d '{"pharmacyName":"CI Pharmacy","ownerName":"CI Owner","email":"ci@example.com","password":"secret123"}' \
            | grep -q '"token"'
          echo "signup ok"

  # The suite runs twice: SQLite for speed, PostgreSQL because that is what
  # production uses, and because the two engines disagree in ways that only show
  # up here — identifier case, HAVING aliases, and COUNT(*) coming back a string.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rxpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run the suite against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rxpos_test
        run: npm run test:pg
